services:
  api:
    build: .
    command: uvicorn atdr.app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/atdr.db}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      RESPONSE_SIMULATION: ${RESPONSE_SIMULATION:-true}
      DEFAULT_IMPORT_LIMIT: ${DEFAULT_IMPORT_LIMIT:-5000}
      MIN_ALERT_SCORE: ${MIN_ALERT_SCORE:-30}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-atdr/models/isolation_forest.joblib}
      ML_CONTAMINATION: ${ML_CONTAMINATION:-0.03}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-before-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8501,http://localhost:8501,http://127.0.0.1:5173,http://localhost:5173}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      SYSLOG_ENABLED: ${SYSLOG_ENABLED:-false}
      SYSLOG_HOST: ${SYSLOG_HOST:-127.0.0.1}
      SYSLOG_PORT: ${SYSLOG_PORT:-5514}
      SYSLOG_BATCH_SIZE: ${SYSLOG_BATCH_SIZE:-100}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - atdr_models:/app/atdr/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    build: .
    command: streamlit run atdr/dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: atdr
      POSTGRES_USER: atdr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atdr_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atdr -d atdr"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    profiles:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://atdr:atdr_dev_password@postgres:5432/atdr}
      AUTO_CREATE_TABLES: "false"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  atdr_models:
