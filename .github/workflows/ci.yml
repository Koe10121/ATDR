name: CI

on:
  push:
  pull_request:

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Config doctor
        run: python -m atdr.scripts.config_doctor

      - name: Compile Python modules
        run: python -m compileall -q atdr migrations

      - name: Run tests
        run: python -m pytest atdr/tests -q

      - name: Apply migrations to CI SQLite database
        run: python -m alembic upgrade head

      - name: Check Alembic migration drift
        run: python -m alembic check

      - name: Ruff safety lint
        run: ruff check atdr migrations
